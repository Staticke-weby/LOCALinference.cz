# Registr mezer: co na webu chybí, kde to hledat a v jaké dávce to řešit.
# `stav`: otevreno | hleda-se | ceka-na-vas | prubezne | hotovo
# `priorita`: P0 (blokuje tvrzení) | P1 (kvalita) | P2 (údržba)
# `kde`: cesty stránek bez lomítek na začátku a bez přípony.
# Kontrola: `npm run chybi`, zápis přehledu: `npm run chybi:zapis`.

davky:
  - id: 1
    nazev: "Generování: rychlosti, licence a slovník"
    cil: "Doplnit čísla, která na stránkách generování chybí, a uzavřít licenční otázky."
  - id: 2
    nazev: "Katalogová data Qwen3.8"
    cil: "TTFT, prefill, souběžnost a dlouhý kontext na všech zařízeních."
  - id: 3
    nazev: "Kvalita, čeština a provoz"
    cil: "Dosadit české testy, vision, tool calling a měření hluku."
  - id: 4
    nazev: "Ceny a dostupnost"
    cil: "Aktuální české ceny všech konfigurací a kurzy."
  - id: 5
    nazev: "Obsah a propojení"
    cil: "Stránky, které na webu chybí, a odkazy mezi nimi."
  - id: 6
    nazev: "Infrastruktura a publikace"
    cil: "Doména, tokeny a věci, které čekají na provozovatele."
  - id: 7
    nazev: "Průběžná údržba"
    cil: "Sledování nových modelů, runtime a zdrojů."

