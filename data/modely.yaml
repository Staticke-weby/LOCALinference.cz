# Katalog modelů. Jen současné modely.
# Na 128 GB je minimum Qwen3.8 Flash Next; na 64 GB Qwen3.6 35B-A3B
# a Gemma 4 26B A4B v Q4.
# Jen modely, které se celé vejdou na jedno zařízení (včetně KV cache).
# Modely vyžadující pool nebo offload nezařazujeme.
# `kontext.doporuceny` je null, dokud pro něj nemáme podložené doporučení.
# `vision: true` je výchozí předpoklad; výjimky označ.

- id: qwen3-8-flash-next
  nazev: Qwen3.8 Flash Next
  vyrobce: Qwen
  architektura: MoE
  parametry_celkem_b: 176
  parametry_aktivni_b: 6
  kontext:
    max: 262144
    max_rozsireni: 1000000
    doporuceny: null
    poznamka: "Maximum není doporučený provozní bod; doporučení [DOPLNIT]."
  vision: true
  modality: [text, obraz]
  licence: Apache-2.0
  kvantizace:
    - {nazev: NVFP4, vahy_gb: 101, engine: vLLM}
    - {nazev: FP8, vahy_gb: 176, engine: vLLM}
    - {nazev: MLX 4bit, vahy_gb: 88, engine: MLX}
    - {nazev: GGUF Q4_K_M, vahy_gb: 95, engine: llama.cpp}
  role: minimum
  stav: doporuceny
  stranka: /modely/qwen3-8-flash-next/
  zdroje:
    - https://huggingface.co/Qwen/Qwen3.8-Flash-Next
    - https://qwen.ai/blog?id=qwen3.8-flash-next
    - https://recipes.vllm.ai/Qwen/Qwen3.8-Flash-Next
  overeno: 2026-11-04

