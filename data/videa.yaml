# Fronta YouTube videí k zařízením.
# Hlídač sem automaticky přidává nová videa ze zdrojů recenze-youtube-*.
# `stav`: novy | prohlednuto | pouzito | zamitnuto
# `kvalita`: 1–5 (5 = nejlepší), nebo null dokud nehodnotíte
# `proc`: proč takový stav; u zamitnuto povinné
# `zarizeni`: id zařízení, ke kterému video patří
# `vydano`: datum publikace (u starších položek odhad z relativního údaje)
# `auto`: true = hodnocení podle popisu a titulků, ne ze zhlédnutí
# `popis` / `nazor`: o čem video je a co říká recenzent (auto = z popisu)
# `delka_s`, `cisla`, `titulky`: co se z videa podařilo zjistit
#
# Novější videa mají přednost: software, enginy a návody k modelům rychle
# stárnou. U videí starších než 6 měsíců ověřte verzi enginu a modelu;
# kvalitní starší video může zůstat, ale nesmí být jediným zdrojem čísel.
# Hledá se za poslední měsíc (YouTube „tento měsíc“) — web se aktualizuje
# aspoň jednou měsíčně, kratší okno by zahodilo videa mezi kontrolami.
# Kontrola: npm run check:videa. Přehled: npm run videa, zápis: npm run videa:zapis
