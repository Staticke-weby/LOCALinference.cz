# Co z generativních modelů poběží na konkrétním zařízení.
# `cas` je převzaté měření s konfigurací; "—" znamená, že veřejné číslo není.
# `odkaz` míří na stránku s modelem a podrobnostmi.

- zarizeni: dgx-spark
  poznamka: "Obrázky jsou veřejně naměřené. U videa a 3D zatím konkrétní číslo nemáme; postup je v oficiálním NVIDIA playbooku."
  polozky:
    - uloha: Obrázky
      model: Z-Image-Turbo
      konfigurace: "1024², 8 kroků, ComfyUI"
      cas: "7,5 s"
      odkaz: /generovani/obrazky/
    - uloha: Obrázky
      model: FLUX.2 klein 4B
      konfigurace: "1024², 4 kroky, ComfyUI"
      cas: "3,1 s"
      odkaz: /generovani/obrazky/
    - uloha: Obrázky
      model: Qwen-Image 2.1 Turbo
      konfigurace: "1024², 8 kroků, ComfyUI"
      cas: "9,5 s"
      odkaz: /generovani/obrazky/
    - uloha: Video
      model: Wan 2.2, LTX-2.5
      konfigurace: "kontejner NVIDIA playbook"
      cas: "—"
      odkaz: /generovani/video/
    - uloha: 3D
      model: TRELLIS.2
      konfigurace: "ComfyUI"
      cas: "—"
      odkaz: /generovani/3d/

