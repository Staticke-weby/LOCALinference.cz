name: Nasazení EN na GitHub Pages

# EN mutace bude v sites/eu. Zdroj zůstává v tomto repu, do
# Staticke-weby/LOCALinference.eu jde jen statický výstup.
# Dokud složka sites/eu neexistuje, workflow se přeskočí.
#
# Vyžaduje secret PUBLIKACE_DEPLOY_KEY: privátní SSH klíč deploy key
# s právem write na Staticke-weby/LOCALinference.eu. Deploy key nemá
# expiraci, na rozdíl od fine-grained PAT (max 1 rok).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nasazeni-eu
  cancel-in-progress: false

jobs:
  publikace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Zjistit, zda EN mutace existuje
        id: check
        run: |
          if [ -f sites/eu/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "sites/eu zatím neexistuje, přeskakuji."
          fi

      - uses: actions/setup-node@v5
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.check.outputs.exists == 'true'

      - run: npm run check
        if: steps.check.outputs.exists == 'true'

      - name: Build EN
        if: steps.check.outputs.exists == 'true'
        working-directory: sites/eu
        run: |
          npm ci
          npm run build

      - name: Publikovat výstup do Staticke-weby/LOCALinference.eu
        if: steps.check.outputs.exists == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PUBLIKACE_DEPLOY_KEY }}
          external_repository: Staticke-weby/LOCALinference.eu
          publish_branch: main
          publish_dir: sites/eu/dist
          force_orphan: true
          cname: www.localinference.eu
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Publikace EN: ${{ github.sha }}'
