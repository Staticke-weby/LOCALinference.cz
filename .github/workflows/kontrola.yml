name: Kontrola a build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build CZ
        working-directory: sites/cz
        run: |
          npm ci
          npm run build
      - name: Kontrola interních odkazů
        run: npm run check:odkazy
      - name: Kontrola prolinkování
        run: npm run check:prolinkovani:strict
