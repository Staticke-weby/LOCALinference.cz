name: Hlídač zdrojů

on:
  schedule:
    - cron: '0 6 * * 1' # každé pondělí 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hlidac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run hlidac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run videa:hodnotit
      # Report je generovaný výstup (vystup/ je v .gitignore), takže se necommituje.
      # Do gitu jde jen stav hlídače a fronta videí.
      - name: Uložit stav a frontu videí
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "hlídač: aktualizace stavu zdrojů"
          file_pattern: data/stav-zdroju.json data/videa.yaml
      - name: Report do souhrnu běhu
        if: always()
        run: |
          if [ -f vystup/hlidac-report.md ]; then
            cat vystup/hlidac-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Report se nevytvořil." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hlidac-report
          path: vystup/hlidac-report.md
